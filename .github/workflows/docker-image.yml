name: Publish Docker image

on:
  push:
    tags: '**'
   # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing tag to build (empty: the ref the workflow runs on)'
        required: false
        default: ''
      images:
        description: 'Images to build'
        type: choice
        options: [all, server, api, frontend, core]
        default: all

jobs:
  push_server:
    name: Push Countly Server Image
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.images == 'all' || inputs.images == 'server' }}
    # ubuntu-22.04, not ubuntu-latest or ubuntu-24.04: this image installs and starts
    # MongoDB 8 during the build, and MongoDB 8 refuses to start on the newer kernels of
    # those runners (SERVER-121912), so the build waited for it until the job timed out
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
        
      - name: Set output
        id: vars
        env:
          VERSION: ${{ inputs.version }}
        run: echo "tag=${VERSION:-${GITHUB_REF#refs/*/}}" >> "$GITHUB_OUTPUT"
      
      - name: Check output
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          echo $RELEASE_VERSION
          echo ${{ steps.vars.outputs.tag }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          tags: countly/countly-server:latest,countly/countly-server:${{ steps.vars.outputs.tag }}
          
  # api and frontend are published for linux/amd64 and linux/arm64. Each architecture
  # builds on a native runner (QEMU would take hours for the Python and CmdStan
  # compiles) and is pushed by digest only; merge_api_frontend then puts both digests
  # under the release tags.
  build_api_frontend:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.images == 'all' || inputs.images == 'api' || inputs.images == 'frontend' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Skip images that were not requested
        id: wanted
        env:
          REQUESTED: ${{ inputs.images }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "$IMAGE" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repo
        if: ${{ steps.wanted.outputs.build == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Log in to Docker Hub
        if: ${{ steps.wanted.outputs.build == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ steps.wanted.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build and push by digest
        if: ${{ steps.wanted.outputs.build == 'true' }}
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile-${{ matrix.image }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=countly/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Save the digest
        if: ${{ steps.wanted.outputs.build == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        if: ${{ steps.wanted.outputs.build == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge_api_frontend:
    name: Push Countly ${{ matrix.image }} Image
    needs: build_api_frontend
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.images == 'all' || inputs.images == 'api' || inputs.images == 'frontend' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [api, frontend]
    steps:
      - name: Skip images that were not requested
        id: wanted
        env:
          REQUESTED: ${{ inputs.images }}
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -z "$REQUESTED" ] || [ "$REQUESTED" = "all" ] || [ "$REQUESTED" = "$IMAGE" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set output
        if: ${{ steps.wanted.outputs.build == 'true' }}
        id: vars
        env:
          VERSION: ${{ inputs.version }}
        run: echo "tag=${VERSION:-${GITHUB_REF#refs/*/}}" >> "$GITHUB_OUTPUT"

      - name: Download the digests
        if: ${{ steps.wanted.outputs.build == 'true' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: /tmp/digests
          pattern: digest-${{ matrix.image }}-*
          merge-multiple: true

      - name: Log in to Docker Hub
        if: ${{ steps.wanted.outputs.build == 'true' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: ${{ steps.wanted.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Create the multi-arch tags
        if: ${{ steps.wanted.outputs.build == 'true' }}
        working-directory: /tmp/digests
        env:
          IMAGE: countly/${{ matrix.image }}
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          echo "$TAG"
          refs=()
          for digest in *; do
            refs+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:$TAG" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$TAG"

  push_all:
    name: Push Countly Single-All Image
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.images == 'all' || inputs.images == 'core' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}
        
      - name: Set output
        id: vars
        env:
          VERSION: ${{ inputs.version }}
        run: echo "tag=${VERSION:-${GITHUB_REF#refs/*/}}" >> "$GITHUB_OUTPUT"
      
      - name: Check output
        env:
          RELEASE_VERSION: ${{ steps.vars.outputs.tag }}
        run: |
          echo $RELEASE_VERSION
          echo ${{ steps.vars.outputs.tag }}
      
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          push: true
          file: ./Dockerfile-core
          tags: countly/countly-core:latest,countly/countly-core:${{ steps.vars.outputs.tag }},countly/countly-core:pipelines-${{ inputs.version || github.base_ref || github.ref_name }}
