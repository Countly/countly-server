
<cly-drawer 
    @submit="onSubmit"
    @close="onClose" 
    v-bind="$props.controls" 
    :title="i18n('token_manager.create-new-token')" 
    :saveButtonLabel="i18n('token_manager.create-token')">
    <template v-slot:default="formScope">
        <cly-form-step id="step1" name="First Step">
            <cly-form-field name="description" :label="i18n('token_manager.table.token-description')">
                <el-input v-model="formScope.editedObject.description" placeholder="Enter token description"></el-input>
            </cly-form-field>
            <cly-form-field class="bu-p-0">
                <div class="bu-is-flex bu-mt-4">
                    <p class="text-big color-cool-gray-100">{{i18n('token_manager.permission.title')}}<i class="el-icon-question bu-ml-2"></i></p>
                </div>
                <p class="text-small color-cool-gray-50" style="margin-top: -10px;">{{i18n('token_manager.permission.description')}}</p>
                <div class="cly-vue-drawer-step__line cly-vue-drawer-step__line--aligned token-manager-drawer__choice bu-mt-0">
                    <el-radio v-model="tokenUsage" label="0" class="is-autosized is-multiline bu-p-4" border>
                        {{i18n('token_manager.permission.full-label')}}
                        <p class="text-small color-cool-gray-50 bu-mt-1">{{i18n('token_manager.permission.full-text')}}</p>
                    </el-radio>
                    <el-radio v-model="tokenUsage" label="1" class="is-autosized is-multiline bu-p-4" border>
                        {{i18n('token_manager.permission.limited-label')}}
                        <p class="text-small color-cool-gray-50 bu-mt-1">{{i18n('token_manager.permission.limited-text')}}</p>
                    </el-radio>
                </div>
            </cly-form-field>
            <cly-form-field v-if="tokenUsage === '0'" class="bu-p-0">
                <el-checkbox v-model="formScope.editedObject.checkboxCanLogin" class="bu-mt-2 color-cool-gray-100">
                    {{i18n('token_manager.permission.can-login')}}
                </el-checkbox>
                <p class="text-small color-cool-gray-50 bu-mt-1">{{i18n('token_manager.permission.can-login-text')}}</p>
            </cly-form-field>
            <cly-form-field v-if="tokenUsage === '1'" class="bu-p-0 bu-mt-4" :label="i18n('token_manager.select-apps')" :name="i18n('token_manager.select-apps')" rules="required">
                <cly-app-select
                    style="width: 100%;"
                    v-model="formScope.editedObject.selectApps"
                    :multiple="true"
                    :collapse-tags="false"
                    show-app-image
                    :placeholder="i18n('token_manager.select-apps')">
                </cly-app-select>
            </cly-form-field>
            <cly-form-field v-if="tokenUsage === '1'" class="bu-p-0">
                <div class="bu-is-flex bu-mt-4">
                    <p class="text-small color-cool-gray-100">{{i18n('token_manager.permission.features')}}</p>
                </div>
                <p class="text-small color-cool-gray-50" style="margin-top: -10px;">{{i18n('token_manager.permission.features-description')}}</p>
                <el-input v-model="searchQuery" :placeholder="i18n('management-users.search-placeholder')" @input="search" class="bu-mt-2 bu-mb-3">
                    <i slot="prefix" class="el-input__icon el-icon-search"></i>
                    <i slot="suffix" class="el-input__icon el-icon-circle-close" @click="clearSearch"></i>
                </el-input>
                <div class="token-manager-drawer__permission-header">
                    <div class="token-manager-drawer__feature-name"></div>
                    <div class="token-manager-drawer__feature-permissions">
                        <div class="token-manager-drawer__permission-box">
                            <el-checkbox @change="setPermissionByType('c')" v-model="allByType.c">{{i18n('management-users.create').toUpperCase()}}</el-checkbox>
                        </div>
                        <div class="token-manager-drawer__permission-box">
                            <el-checkbox @change="setPermissionByType('r')" v-model="allByType.r">{{i18n('management-users.read').toUpperCase()}}</el-checkbox>
                        </div>
                        <div class="token-manager-drawer__permission-box">
                            <el-checkbox @change="setPermissionByType('u')" v-model="allByType.u">{{i18n('management-users.update').toUpperCase()}}</el-checkbox>
                        </div>
                        <div class="token-manager-drawer__permission-box">
                            <el-checkbox @change="setPermissionByType('d')" v-model="allByType.d">{{i18n('management-users.delete').toUpperCase()}}</el-checkbox>
                        </div>
                    </div>
                </div>
                <div class="token-manager-drawer__permission-row" v-for="feature in filteredFeatures" :key="feature">
                    <div class="token-manager-drawer__feature-name text-small color-cool-gray-100">{{featureBeautifier(feature)}}</div>
                    <div class="token-manager-drawer__feature-permissions">
                        <div class="token-manager-drawer__permission-box">
                            <el-checkbox @change="setPermissionByFeature('c', feature)" v-model="permissionSet.c.allowed[feature]"></el-checkbox>
                        </div>
                        <div class="token-manager-drawer__permission-box">
                            <el-checkbox @change="setPermissionByFeature('r', feature)" v-model="permissionSet.r.allowed[feature]"></el-checkbox>
                        </div>
                        <div class="token-manager-drawer__permission-box">
                            <el-checkbox @change="setPermissionByFeature('u', feature)" v-model="permissionSet.u.allowed[feature]"></el-checkbox>
                        </div>
                        <div class="token-manager-drawer__permission-box">
                            <el-checkbox @change="setPermissionByFeature('d', feature)" v-model="permissionSet.d.allowed[feature]"></el-checkbox>
                        </div>
                    </div>
                </div>
            </cly-form-field>
            <cly-form-field class="bu-p-0">
                <div class="bu-is-flex bu-mt-4">
                    <p class="text-big color-cool-gray-100">{{i18n('token_manager.table.limit-title')}}<i class="el-icon-question bu-ml-2"></i></p>
                </div>
                <div class="cly-vue-drawer-step__line cly-vue-drawer-step__line--aligned">
                    <el-radio class="is-autosized is-multiline color-cool-gray-100 bu-p-4" v-model="tokenExpiration" label="0" border>
                        {{i18n('token_manager.table.limit-allow.label')}}
                        <p class="text-small color-cool-gray-50 bu-mt-1">{{i18n('token_manager.table.limit-allow.text')}}</p>
                    </el-radio>
                    <el-radio class="is-autosized is-multiline color-cool-gray-100 bu-p-4" v-model="tokenExpiration" label="1" border>
                        {{i18n('token_manager.table.limit-limit.label')}}
                        <p class="text-small color-cool-gray-50 bu-mt-1">{{i18n('token_manager.table.limit-limit.text')}}</p>
                    </el-radio>
                </div>
            </cly-form-field>
            <cly-form-field v-if="tokenExpiration === '1'" class="bu-p-0">
                <div class="bu-is-flex bu-mt-2">
                    <p class="text-big color-cool-gray-100">{{i18n('token_manager.token-expiration-time')}}<i class="el-icon-question bu-ml-2"></i></p>
                </div>
                <p class="text-small color-cool-gray-50" style="margin-top: -10px;">{{i18n('token_manager.table.expiration-description')}}</p>
                <div class="bu-is-flex" style="max-width: 240px;">
                    <el-input v-model="formScope.editedObject.timeInput"></el-input>
                    <el-select v-model="formScope.editedObject.selectTime" :multiple="false">
                        <el-option v-for="item in constants.availableProps" :key="item.value" :value="item.value" :label="item.label">
                        </el-option>
                    </el-select>
                </div>
            </cly-form-field>
            <cly-form-field class="bu-p-0">
                <el-checkbox v-model="formScope.editedObject.checkboxMultipleTimes" class="bu-mt-5 color-cool-gray-100">
                    {{i18n('token_manager.table.multi-desc')}}
                </el-checkbox>
            </cly-form-field>
        </cly-form-step>
    </template>
</cly-drawer>
